<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lelapa × Claude — isiZulu voice chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #6F3FF5;
    --purple-soft: #EFE7FF;
    --coral: #FF6A4D;
    --coral-soft: #FFE3DA;
    --cream: #FFF6EE;
    --ink: #1A1233;
    --muted: #6B6485;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Space Grotesk", -apple-system, system-ui, sans-serif;
    background:
      radial-gradient(1100px 600px at 90% -10%, rgba(255,106,77,0.30), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(111,63,245,0.25), transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, #FFEFE0 100%);
    color: var(--ink);
    height: 100vh;
    display: flex; flex-direction: column;
  }

  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.9rem 1.25rem;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(111,63,245,0.10);
  }
  .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--purple) 0%, var(--coral) 100%);
    display: grid; place-items: center;
    color: white; font-weight: 700;
    box-shadow: 0 6px 18px -6px rgba(111,63,245,0.55);
  }
  .title { display: flex; flex-direction: column; line-height: 1.1; }
  .title b { font-weight: 700; font-size: 1rem; }
  .title b .accent { color: var(--coral); }
  .title small { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .spacer { flex: 1; }
  .clear {
    appearance: none; border: 1px solid rgba(111,63,245,0.25);
    background: white; color: var(--purple);
    font-family: inherit; font-size: 0.8rem; font-weight: 500;
    padding: 0.45rem 0.85rem; border-radius: 999px; cursor: pointer;
  }
  .clear:hover { background: var(--purple-soft); }

  main {
    flex: 1 1 auto; overflow-y: auto;
    padding: 1.5rem 1rem 1rem;
  }
  .chat { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.85rem; }

  .empty {
    text-align: center; color: var(--muted); padding: 3rem 1rem 1rem;
  }
  .empty h2 { margin: 0 0 0.4rem; color: var(--ink); font-size: 1.5rem; letter-spacing: -0.01em; }
  .empty h2 .accent { color: var(--coral); }
  .empty p { margin: 0; font-size: 0.95rem; }

  .msg { display: flex; max-width: 88%; }
  .msg.user { align-self: flex-end; }
  .msg.claude { align-self: flex-start; }
  .bubble {
    border-radius: 18px; padding: 0.7rem 0.95rem;
    box-shadow: 0 12px 30px -18px rgba(42,25,104,0.45), 0 1px 2px rgba(42,25,104,0.06);
    border: 1px solid rgba(111,63,245,0.08);
    background: white;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--coral) 0%, #FF8866 100%);
    color: white;
    border: 0;
    border-bottom-right-radius: 6px;
  }
  .msg.claude .bubble {
    background: white;
    border-bottom-left-radius: 6px;
  }
  .primary {
    font-size: 1.02rem; line-height: 1.45; white-space: pre-wrap;
    font-weight: 500;
  }
  .secondary {
    margin-top: 0.35rem; padding-top: 0.4rem;
    border-top: 1px dashed rgba(255,255,255,0.4);
    font-size: 0.85rem; line-height: 1.45; white-space: pre-wrap;
    opacity: 0.92;
  }
  .msg.claude .secondary {
    border-top-color: rgba(42,25,104,0.12);
    color: var(--muted);
  }
  .tag {
    font-family: "DM Mono", monospace; font-size: 0.62rem;
    letter-spacing: 0.08em; text-transform: uppercase;
    opacity: 0.7; margin-bottom: 0.15rem;
  }
  .audio-wrap {
    margin-top: 0.5rem; padding-top: 0.45rem;
    border-top: 1px dashed rgba(42,25,104,0.12);
  }
  .audio-wrap audio { width: 100%; height: 34px; }

  .typing { display: inline-flex; gap: 4px; padding: 0.4rem 0.2rem; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--purple); opacity: 0.4;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  .err {
    align-self: center;
    background: #fff3f0; border: 1px solid #ffb3a0; color: #8a2a14;
    border-radius: 14px; padding: 0.7rem 1rem;
    font-family: "DM Mono", monospace; font-size: 0.8rem;
    white-space: pre-wrap; max-width: 88%;
  }

  footer {
    flex: 0 0 auto;
    padding: 1rem 1rem 1.25rem;
    background: linear-gradient(180deg, rgba(255,246,238,0) 0%, rgba(255,246,238,0.95) 30%, var(--cream) 100%);
  }
  .composer {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: center; gap: 0.85rem;
    background: white; border-radius: 999px;
    padding: 0.55rem 0.65rem 0.55rem 1.1rem;
    box-shadow: 0 20px 50px -25px rgba(42,25,104,0.4), 0 2px 6px -2px rgba(42,25,104,0.08);
    border: 1px solid rgba(111,63,245,0.10);
  }
  #status {
    flex: 1; color: var(--muted);
    font-family: "DM Mono", monospace; font-size: 0.85rem;
  }
  #btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit; font-weight: 600; font-size: 0.95rem;
    padding: 0.75rem 1.25rem; border-radius: 999px;
    background: linear-gradient(135deg, var(--purple) 0%, #8E5BFF 100%);
    color: white; box-shadow: 0 8px 22px -8px rgba(111,63,245,0.7);
    transition: transform 0.08s ease;
    display: inline-flex; align-items: center; gap: 0.5rem;
  }
  #btn:hover { transform: translateY(-1px); }
  #btn.rec {
    background: linear-gradient(135deg, var(--coral) 0%, #FF8866 100%);
    animation: pulse 1.4s infinite;
  }
  #btn:disabled { opacity: 0.6; cursor: not-allowed; animation: none; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,106,77,0.55); }
    70%  { box-shadow: 0 0 0 14px rgba(255,106,77,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,106,77,0); }
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: white; }
</style>
</head>
<body>
  <header>
    <div class="logo">L</div>
    <div class="title">
      <b>lelapa × <span class="accent">claude</span></b>
      <small>isiZulu voice chat</small>
    </div>
    <div class="spacer"></div>
    <button class="clear" id="clear">New chat</button>
  </header>

  <main id="main">
    <div class="chat" id="chat">
      <div class="empty" id="empty">
        <h2>Khuluma no<span class="accent">Claude</span> ngesiZulu</h2>
        <p>Press the record button below and say something in isiZulu.</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="composer">
      <span id="status">ready</span>
      <button id="btn"><span class="dot"></span><span id="btn-label">Record</span></button>
    </div>
  </footer>

<script>
const btn = document.getElementById("btn");
const btnLabel = document.getElementById("btn-label");
const statusEl = document.getElementById("status");
const chat = document.getElementById("chat");
const main = document.getElementById("main");
const empty = document.getElementById("empty");
const clearBtn = document.getElementById("clear");

let mediaRecorder = null;
let chunks = [];
let recording = false;
// History of English text we send to Claude (role: "user" | "assistant")
let history = [];

const setStatus = s => { statusEl.textContent = s; };
const scrollToBottom = () => { main.scrollTop = main.scrollHeight; };

function hideEmpty() { if (empty) empty.remove(); }

function addMessage(role, primary, secondary, audioUri) {
  hideEmpty();
  const msg = document.createElement("div");
  msg.className = `msg ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = `
    <div><div class="tag">isiZulu</div><div class="primary"></div></div>
    <div class="secondary-wrap"><div class="tag">English</div><div class="secondary"></div></div>
  `;
  bubble.querySelector(".primary").textContent = primary;
  bubble.querySelector(".secondary").textContent = secondary;
  if (audioUri) {
    const audioWrap = document.createElement("div");
    audioWrap.className = "audio-wrap";
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "auto";
    audio.src = audioUri;
    audioWrap.appendChild(audio);
    bubble.appendChild(audioWrap);
    // Auto-play the spoken reply. Browsers may block autoplay until the user
    // has interacted with the page; the visible controls are the fallback.
    audio.play().catch(() => {});
  }
  msg.appendChild(bubble);
  chat.appendChild(msg);
  scrollToBottom();
  return msg;
}

function addTyping() {
  hideEmpty();
  const msg = document.createElement("div");
  msg.className = "msg claude";
  msg.id = "typing";
  msg.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(msg);
  scrollToBottom();
}
function removeTyping() { document.getElementById("typing")?.remove(); }

function addError(data) {
  removeTyping();
  const e = document.createElement("div");
  e.className = "err";
  e.textContent = `error at ${data.stage || "?"} (${data.type || "Error"}): ${data.error || ""}`;
  chat.appendChild(e);
  scrollToBottom();
}

async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
    mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
    chunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      await send(new Blob(chunks, { type: mime }));
    };
    mediaRecorder.start();
    recording = true;
    btn.classList.add("rec");
    btnLabel.textContent = "Stop";
    setStatus("● listening…");
  } catch (e) {
    setStatus("mic blocked");
    addError({ stage: "mic", type: e.name, error: e.message });
  }
}

function stop() {
  if (!recording) return;
  recording = false;
  btn.classList.remove("rec");
  btnLabel.textContent = "Record";
  setStatus("processing…");
  mediaRecorder.stop();
}

async function send(blob) {
  btn.disabled = true;
  addTyping();
  try {
    const form = new FormData();
    form.append("audio", blob, "speech.webm");
    form.append("history", JSON.stringify(history));
    const r = await fetch("/api/voice", { method: "POST", body: form });
    const data = await r.json();
    removeTyping();
    if (!r.ok) {
      addError(data);
      setStatus("error");
      return;
    }
    addMessage("user", data.zulu_in, data.english_in);
    addMessage("claude", data.zulu_out, data.english_out, data.audio_out);
    history.push({ role: "user", content: data.english_in });
    history.push({ role: "assistant", content: data.english_out });
    setStatus("ready");
  } catch (e) {
    removeTyping();
    addError({ stage: "network", type: e.name, error: e.message });
    setStatus("error");
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener("click", () => recording ? stop() : start());
clearBtn.addEventListener("click", () => {
  history = [];
  chat.innerHTML = "";
  chat.appendChild(empty.cloneNode(true));
  setStatus("ready");
});
</script>
</body>
</html>
